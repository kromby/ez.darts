version = 1

exclude_patterns = [
  "docs/**",
  "web/dist/**",
  "web/node_modules/**",
  "api/**/bin/**",
  "api/**/obj/**",
]

test_patterns = [
  "web/src/**/*.test.ts",
  "web/src/**/*.test.tsx",
  "web/src/test/**",
  "api/EzDarts.Api.Tests/**",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["browser", "vitest"]
  dependency_file_paths = ["web"]

[[analyzers]]
name = "csharp"
enabled = true
