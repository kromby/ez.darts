name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, test, build)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  api:
    name: API (test, publish)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test api/EzDarts.slnx --configuration Release
      - run: dotnet publish api/EzDarts.Api --configuration Release --output api-publish
      - uses: actions/upload-artifact@v7
        with:
          name: api-publish
          path: api-publish
          # The Functions publish output includes a hidden .azurefunctions folder.
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy to Static Web App
    needs: [web, api]
    # Fork PRs get no secrets, so they're tested but not deployed.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets the deploy action comment the preview URL on the PR
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist
      - uses: actions/download-artifact@v8
        with:
          name: api-publish
          path: api-publish
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web-dist
          api_location: api-publish
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close-preview:
    name: Close PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ''
